      border: none;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);

    let curTier = '中性';
    let curMetric = 'issued_w';
    let curMetricUnit = '万';
    let curMetricTitle = '出票量';

    const chart = echarts.init(document.getElementById('mainChart'));

    function getData(tier, line, metric) {
      const map = new Map();
      DATA.filter(r => r.tier === tier && r.line === line).forEach(r => {
        map.set(r.date, r[metric]);
      });
      return DATES.map(d => map.get(d) || 0);
    }

    function updateKPIs() {
      let totNet = 0, totProfit = 0, totIssued = 0;
      DATA.filter(r => r.tier === curTier && r.line === '合计').forEach(r => {
        totNet += r.net_w;
        totProfit += r.profit_w;
        totIssued += r.issued_w;
      });
      const avgUnit = (totProfit / totNet).toFixed(2);
      const avgRefund = ((totIssued - totNet) / totIssued * 100).toFixed(2);

      const html = `
        <div class="kpi-card" style="border-left-color: #1890ff;">
          <div class="label">2027 C端总出票量</div>
          <div class="value">${(totIssued/10000).toFixed(2)} <span style="font-size:16px;">亿</span></div>
          <div class="sub">净票量 ${(totNet/10000).toFixed(2)} 亿</div>
        </div>
        <div class="kpi-card" style="border-left-color: #52c41a;">
          <div class="label">2027 C端营业收益</div>
          <div class="value">${(totProfit/10000).toFixed(2)} <span style="font-size:16px;">亿</span></div>
          <div class="sub">平均单收 ${avgUnit} 元/净票</div>
        </div>
        <div class="kpi-card" style="border-left-color: #fa8c16;">
          <div class="label">全盘综合退票率</div>
          <div class="value">${avgRefund} <span style="font-size:16px;">%</span></div>
          <div class="sub">退票总量 ${( (totIssued - totNet)/10000 ).toFixed(2)} 亿</div>
        </div>
        <div class="kpi-card" style="border-left-color: #722ed1;">
          <div class="label">当前选定档位</div>
          <div class="value">${curTier}档</div>
          <div class="sub">${curTier === '中性' ? '纯抢-22%, 智慧-7%, 纯买-9%' : curTier === '保守' ? '纯抢-26%, 智慧-10%, 纯买-12%' : '纯抢-32%, 智慧-13%, 纯买-15%'}</div>
        </div>
      `;
      document.getElementById('kpiCards').innerHTML = html;
    }

    function updateChart() {
      const cTot = getData(curTier, '合计', curMetric);
      const cMai = getData(curTier, '纯买', curMetric);
      const cZhi = getData(curTier, '买得到', curMetric);
      const cQia = getData(curTier, '纯抢', curMetric);

      const option = {
        title: {
          text: `2027 年 C端按天走势 · ${curMetricTitle} (${curTier}档)`,
          left: 'center',
          top: 10,
          textStyle: { fontSize: 16, fontWeight: 600 }
        },
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'cross' },
          formatter: function(params) {
            let s = `<div style="font-weight:600;margin-bottom:4px;">${params[0].axisValue}</div>`;
            params.forEach(p => {
              s += `<div style="display:flex;justify-content:space-between;gap:16px;">
                      <span>${p.marker} ${p.seriesName}:</span>
                      <b>${p.value} ${curMetricUnit}</b>
                    </div>`;
            });
            return s;
          }
        },
        legend: { top: 40, data: ['合计', '纯买', '买得到', '纯抢'] },
        grid: { top: 85, right: 30, bottom: 75, left: 60 },
        dataZoom: [
          { type: 'slider', bottom: 15, start: 0, end: 100 },
          { type: 'inside' }
        ],
        xAxis: {
          type: 'category',
          data: DATES,
          boundaryGap: false,
          axisLine: { lineStyle: { color: '#ccc' } },
          axisLabel: { color: '#666' }
        },
        yAxis: {
          type: 'value',
          name: curMetricUnit,
          axisLine: { show: true, lineStyle: { color: '#ccc' } },
          splitLine: { lineStyle: { color: '#f0f0f0' } }
        },
        series: [
          {
            name: '合计',
            type: 'line',
            data: cTot,
            smooth: true,
            lineStyle: { width: 2.5, color: '#1890ff' },
            itemStyle: { color: '#1890ff' },
            markArea: {
              silent: true,
              itemStyle: { color: 'rgba(255, 170, 0, 0.08)' },
              data: [
                [{ name: '春运', xAxis: '2027-01-16' }, { xAxis: '2027-02-24' }],
                [{ name: '五一', xAxis: '2027-04-30' }, { xAxis: '2027-05-05' }],
                [{ name: '暑运', xAxis: '2027-07-01' }, { xAxis: '2027-08-31' }],
                [{ name: '国庆', xAxis: '2027-09-30' }, { xAxis: '2027-10-07' }]
              ]
            }
          },
          {
            name: '纯买',
            type: 'line',
            data: cMai,
            smooth: true,
            lineStyle: { width: 1.8, color: '#52c41a' },
            itemStyle: { color: '#52c41a' }
          },
          {
            name: '买得到',
            type: 'line',
            data: cZhi,
            smooth: true,
            lineStyle: { width: 1.8, color: '#722ed1' },
            itemStyle: { color: '#722ed1' }
          },
          {
            name: '纯抢',
            type: 'line',
            data: cQia,
            smooth: true,
            lineStyle: { width: 1.8, color: '#fa8c16' },
            itemStyle: { color: '#fa8c16' }
          }
        ]
      };
      chart.setOption(option, true);
    }

    function updateTable() {
      const months = Array.from({length: 12}, (_, i) => String(i+1).padStart(2, '0'));
      let tbody = '';
      months.forEach(m => {
        const mKey = '2027-' + m;
        const sub = DATA.filter(r => r.tier === curTier && r.date.startsWith(mKey));
        const getSum = (line, met) => sub.filter(r => r.line === line).reduce((acc, r) => acc + r[met], 0);
        
        const issMai = getSum('纯买', 'issued_w').toFixed(1);
        const issZhi = getSum('买得到', 'issued_w').toFixed(1);
        const issQia = getSum('纯抢', 'issued_w').toFixed(1);
        const issTot = getSum('合计', 'issued_w').toFixed(1);
        const netTot = getSum('合计', 'net_w').toFixed(1);
        const pfTot = getSum('合计', 'profit_w').toFixed(1);
        const upTot = (pfTot / netTot).toFixed(2);
        const rrTot = ((issTot - netTot) / issTot * 100).toFixed(2);

        tbody += `<tr>
          <td><b>${parseInt(m)}月</b></td>
          <td>${issMai}</td>
          <td>${issZhi}</td>
          <td>${issQia}</td>
          <td><b>${issTot}</b></td>
          <td>${netTot}</td>
          <td><b style="color:#52c41a;">${pfTot}</b></td>
          <td>${upTot}</td>
          <td>${rrTot}%</td>
        </tr>`;
      });
      document.querySelector('#monthTable tbody').innerHTML = tbody;
    }

    function refreshAll() {
      updateKPIs();
      updateChart();
      updateTable();
    }

    document.querySelectorAll('#tierGroup .btn').forEach(btn => {
      btn.addEventListener('click', e => {
        document.querySelectorAll('#tierGroup .btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        curTier = e.target.dataset.val;
        refreshAll();
      });
    });

    document.querySelectorAll('#metricGroup .btn').forEach(btn => {
      btn.addEventListener('click', e => {
        document.querySelectorAll('#metricGroup .btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        curMetric = e.target.dataset.val;
        curMetricUnit = e.target.dataset.unit;
        curMetricTitle = e.target.dataset.title;
        updateChart();
      });
    });

    window.addEventListener('resize', () => chart.resize());
    refreshAll();
  </script>
